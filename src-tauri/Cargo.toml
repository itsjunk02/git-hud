[package]
name = "git-hud"
version = "0.1.0"
description = "git-hud — a lightweight, high-performance cross-platform Git GUI"
authors = ["git-hud contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (matters on Windows,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "git_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core + plugins ---
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Git engine (libgit2 bindings, vendored; no CLI subprocess, no network features) ---
git2 = { version = "0.21", default-features = false }

# --- Local cache (SQLite, bundled from source) + versioned migrations ---
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"

# --- Async workers + filesystem watching ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
notify = "8"

# --- Utilities ---
dirs = "6"
thiserror = "2"

# --- Type-safe IPC binding generation (Rust command signatures -> TypeScript) ---
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
