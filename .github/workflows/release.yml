name: Release

# Builds signed-or-unsigned installers for macOS, Linux, and Windows and attaches them to
# a GitHub Release. Trigger by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`)
# or manually via the Actions tab.
#
# Code signing is OPTIONAL. To sign + notarize, add these repository secrets; when they are
# absent the artifacts build UNSIGNED (users may hit Gatekeeper / SmartScreen warnings):
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14       # Apple Silicon (arm64) -> git-hud_x.y.z_aarch64.dmg
          - platform: macos-13       # Intel (x64)           -> git-hud_x.y.z_x64.dmg
          - platform: ubuntu-22.04   # -> .deb + .AppImage (+ .rpm)
          - platform: windows-latest # -> .msi + setup .exe (nsis)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libxdo-dev \
            file wget curl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Enable macOS signing + notarization ONLY when the certificate secret is present.
      # Tauri's bundler reads APPLE_CERTIFICATE via std::env::var_os, which returns Some("")
      # for an *empty-but-defined* variable — so it enters the signing path and then fails
      # `security import` on the empty value. We must therefore leave these vars UNSET for
      # unsigned builds instead of piping empty `secrets.*` straight into tauri-action's env.
      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "::notice::Apple signing secrets found — building SIGNED + notarized macOS artifacts."
            for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                       APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              printf '%s<<__GH_EOF__\n%s\n__GH_EOF__\n' "$var" "${!var}" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::No APPLE_CERTIFICATE secret — building UNSIGNED macOS artifacts (users will see a Gatekeeper warning on first launch)."
          fi

      # Same guard for Windows Authenticode signing (empty cert is harmless today, but keep
      # the structure symmetric so a WINDOWS_CERTIFICATE secret just flows through later).
      - name: Configure Windows code signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "::notice::Windows signing secret found — building SIGNED installers."
            for var in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
              printf '%s<<__GH_EOF__\n%s\n__GH_EOF__\n' "$var" "${!var}" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::No WINDOWS_CERTIFICATE secret — building UNSIGNED installers (SmartScreen may warn)."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing vars are injected into $GITHUB_ENV by the guarded steps above ONLY when
          # their secrets exist; otherwise they stay unset and the build is unsigned.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'git-hud ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform from the assets below. These builds are currently unsigned — see the README “Install” section for first-launch instructions on macOS and Windows.'
          releaseDraft: true
          prerelease: false
